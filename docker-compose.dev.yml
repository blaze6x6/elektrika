services:
  # ── PostgreSQL baza ──
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    container_name: strom-db
    environment:
      POSTGRES_USER: ${DB_USER:-energy_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-energy_pass_123}
      POSTGRES_DB: ${DB_NAME:-energydb}
      TZ: ${TZ:-Europe/Ljubljana}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-energy_user} -d ${DB_NAME:-energydb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Next.js aplikacija ──
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: strom-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-energy_user}:${DB_PASSWORD:-energy_pass_123}@db:5432/${DB_NAME:-energydb}
      - JWT_SECRET=${JWT_SECRET:-spremeni_me_v_produkciji_abc123}
      - NODE_ENV=production
      # POMEMBNO: nastavi na "true" samo če imaš HTTPS (nginx + certbot)
      # Če dostopaš prek http://ip:3000, mora biti "false"
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      # SolarEdge API (opcijsko)
      - SOLAREDGE_API_KEY=${SOLAREDGE_API_KEY:-}
      - SOLAREDGE_SITE_ID=${SOLAREDGE_SITE_ID:-}
      # MELCloud API (opcijsko)
      - MELCLOUD_EMAIL=${MELCLOUD_EMAIL:-}
      - MELCLOUD_PASSWORD=${MELCLOUD_PASSWORD:-}
      - MELCLOUD_DEVICE_ID=${MELCLOUD_DEVICE_ID:-}
      - SESSION_DAYS=${SESSION_DAYS:-180}
      - TZ=${TZ:-Europe/Ljubljana}
      # GSRN merilne točke potrebuješ za endpoint /merilna-tocka/{gsrn}
      - MOJELEKTRO_API_KEY=${MOJELEKTRO_API_KEY:-}
      - MOJELEKTRO_EIMM=${MOJELEKTRO_EIMM:-}
      - MOJELEKTRO_GSRN_MT=${MOJELEKTRO_GSRN_MT:-}
    depends_on:
      db:
        condition: service_healthy

  cron:
    build:
      context: .
      dockerfile: Dockerfile.cron
    container_name: strom-cron-sync
    restart: unless-stopped
    environment:
      - APP_URL=http://web:3000
      - CRON_SECRET=${CRON_SECRET:-energy_cron_secret_123}
      - TZ=${TZ:-Europe/Ljubljana}
    depends_on:
      - web
    command:
      - /bin/sh
      - -c
      - |
        cp /usr/share/zoneinfo/$${TZ:-Europe/Ljubljana} /etc/localtime
        echo "$${TZ:-Europe/Ljubljana}" > /etc/timezone
        echo "⏰ Cron zagnan. Sinhronizacija vsak dan ob 4:00 ($${TZ:-Europe/Ljubljana})"
        echo "0 4 * * * /app/cron-sync.sh >> /var/log/cron-sync.log 2>&1" > /etc/crontabs/root
        crond -f -l 2

volumes:
  pgdata:
    driver: local
