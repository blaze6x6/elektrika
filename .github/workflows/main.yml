name: Build and Push Docker Images

on:
  push:
    branches: [ "main", "master" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Pridobi kodo (Checkout)
        uses: actions/checkout@v4

      - name: Prijava v Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Nastavi Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 1. Gradnja in objava za "web" storitev (Dockerfile) ──
      - name: Gradnja in objava Docker slike (web)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            blaze666/elektrika-web:latest
            blaze666/elektrika-web:${{ github.sha }}

      # ── 2. Gradnja in objava za "cron" storitev (Dockerfile.cron) ──
      - name: Gradnja in objava Docker slike (cron)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.cron
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            blaze666/elektrika-cron:latest
            blaze666/elektrika-cron:${{ github.sha }}
